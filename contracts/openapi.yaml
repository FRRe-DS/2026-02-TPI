  /api/v1/conductores/{id_conductor}/estado:
    parameters:
      - {$ref: '#/components/parameters/IdConductor'}
    get:
      operationId: obtenerEstadoConductor
      summary: Estado operativo del conductor (contrato común M3 2.0.0)
      description: >-
        Lo consulta M4 al validar un candidato. DESCONECTADO sin intención o con connected=false; OCUPADO con un viaje
        asignado o en curso; DISPONIBLE si pidió recibir viajes y en este momento tiene habilitación APROBADA, vehículo
        activo APROBADA y licencia, seguro y cédula aprobados y vigentes; CONECTADO en los demás casos. No depende de
        la confirmación de M4 (APPLIED): informa lo que M3 sabe del conductor.
      tags: [Contrato común M3 2.0.0]
      x-allowed-human-roles: [Conductor (propio), Operador, Administrador]
      x-required-service-roles: [SERVICIO, ubicacion-be, solicitud-be, viajes-be, 'SCOPE_m3:drivers:read']
      responses:
        '200':
          description: Estado vigente.
          headers:
            ETag: {$ref: '#/components/headers/DriverETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EstadoConductor'}
              example:
                id_conductor: 0b8e5c1a-3f2d-4e6a-9b7c-5d4e3f2a1b0c
                estado: DISPONIBLE
                id_vehiculo_activo: 4697c312-9dc5-57e2-820f-ef7f84215e81
                actualizado: '2026-11-28T11:15:30.123Z'
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/ErrorContrato'}
        '404': {$ref: '#/components/responses/ErrorContrato'}

