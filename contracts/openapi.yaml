# M3 — Conductores y Vehículos. Propuesta académica 0.2.0.
# Adaptación de arquitectura a Java/Spring Boot y web Thymeleaf en E1.
# API sin cambios respecto de 0.1.1: mismas rutas, operaciones, permisos y schemas.
# Leer junto con M3_Arquitectura_TPI_Java_Web.md.
# La web /ui/** usa sesión OIDC + CSRF; sus páginas no son parte de este contrato JSON.
# La API sigue usando Bearer JWT, no cookies. Acuerdos M1/M4/M5/M6 pendientes.
openapi: 3.0.3
info:
  title: M3 — Conductores y Vehículos
  version: 0.2.0
  description: >-
    PROPUESTA para revisión, no contrato aprobado ni implementación desplegada. Base: RF-3.1 a RF-3.7 del TPI 2026.
    Arquitectura Java/Spring Boot y PostgreSQL; web Thymeleaf prevista desde E1. El cambio de stack no modifica las
    operaciones JSON del contrato 0.1.1. Las páginas HTML /ui/** y el login OIDC se documentan en el Markdown asociado,
    no en paths. La sesión web no autentica estas operaciones: la API mantiene Bearer JWT.
    Las extensiones x-allowed-human-roles y x-required-service-scopes documentan el acceso; Spring Security y los casos
    de uso deben aplicar permisos y propiedad. Roles y scopes se acuerdan con M1. Ningún token técnico representa a
    un conductor humano. Las operaciones E2 permanecen en el diseño; la release E1 publicará sólo las implementadas.
    API versionada /api/v1. Las respuestas de habilitación no constituyen reserva ni asignación.
servers:
  - url: 'http://localhost:3003'
    description: Ejemplo local; reemplazar en el entorno integrador. HTTPS al publicar.
tags:
  - name: Drivers
  - name: Vehicles
  - name: Documents
  - name: Qualifications
  - name: Availability
  - name: Integration
  - name: Ratings
  - name: Health
security:
  - bearerAuth: []

# OPERACIONES DE M3
paths:

  /api/v1/drivers:
    post:
      operationId: createOwnDriver
      summary: Crear perfil propio
      description: Sólo usuario humano. El sub verificado identifica el perfil. El mismo sub no puede registrar dos 
        conductores.
      tags: [Drivers]
      x-planned-delivery: E1
      x-allowed-human-roles: [Conductor]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDriver'}
      responses:
        '201':
          description: Creado.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
            ETag: {$ref: '#/components/headers/DriverETag'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Driver'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
    get:
      operationId: listDrivers
      summary: Consultar conductores como operador
      tags: [Drivers]
      x-planned-delivery: E1
      x-allowed-human-roles: [Operador, Administrador]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Respuesta correcta.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
            ETag: {$ref: '#/components/headers/DriverETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverPage'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}

  /api/v1/me/driver:
    get:
      operationId: getOwnDriver
      summary: Consultar mi perfil
      tags: [Drivers]
      x-planned-delivery: E1
      x-allowed-human-roles: [Conductor]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {$ref: '#/components/responses/DriverOk'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}

  /api/v1/drivers/{driverId}:
    parameters:
      - {$ref: '#/components/parameters/DriverId'}
    get:
      operationId: getDriver
      summary: Consultar perfil y versión del agregado
      description: >-
        Conductor sólo propio; operador/administrador con autorización. Se devuelve ETag para todas las mutaciones del
