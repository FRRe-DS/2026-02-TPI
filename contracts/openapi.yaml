        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '412': {$ref: '#/components/responses/Error412'}
        '422': {$ref: '#/components/responses/Error422'}
        '428': {$ref: '#/components/responses/Error428'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}

  /api/v1/drivers/{driverId}/documents/{documentId}/reviews:
    parameters:
      - {$ref: '#/components/parameters/DriverId'}
      - {$ref: '#/components/parameters/DocumentId'}
    post:
      operationId: reviewDocument
      summary: Revisar documento con motivo
      description: >-
        Admite documento del conductor o de uno de sus vehículos; comprobar la relación completa. Crea auditoría, no cambia
        contenido de la revisión.
      tags: [Documents]
      x-planned-delivery: E1
      x-allowed-human-roles: [Operador, Administrador]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDocument'}
      responses:
        '200':
          description: Respuesta correcta.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
            ETag: {$ref: '#/components/headers/DriverETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '412': {$ref: '#/components/responses/Error412'}
        '422': {$ref: '#/components/responses/Error422'}
        '428': {$ref: '#/components/responses/Error428'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}

  /api/v1/drivers/{driverId}/qualification-decisions:
    parameters:
      - {$ref: '#/components/parameters/DriverId'}
    get:
      operationId: getDriverQualificationHistory
      summary: Consultar historial de habilitación del conductor
      tags: [Qualifications]
      x-planned-delivery: E1
      x-allowed-human-roles: [Conductor, Operador, Administrador]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {$ref: '#/components/responses/QualificationPageOk'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
    post:
      operationId: decideDriverQualification
      summary: Resolver habilitación del conductor
      tags: [Qualifications]
      x-planned-delivery: E1
      x-allowed-human-roles: [Operador, Administrador]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QualificationDecisionInput'}
      responses:
        '201': {$ref: '#/components/responses/QualificationDecisionCreated'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '412': {$ref: '#/components/responses/Error412'}
        '422': {$ref: '#/components/responses/Error422'}
        '428': {$ref: '#/components/responses/Error428'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}

  /api/v1/drivers/{driverId}/vehicles/{vehicleId}/qualification-decisions:
    parameters:
      - {$ref: '#/components/parameters/DriverId'}
      - {$ref: '#/components/parameters/VehicleId'}
    get:
      operationId: getVehicleQualificationHistory
      summary: Consultar historial de habilitación del vehículo
      tags: [Qualifications]
      x-planned-delivery: E1
      x-allowed-human-roles: [Conductor, Operador, Administrador]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
