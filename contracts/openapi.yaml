              schema: {$ref: '#/components/schemas/VehiculoContrato'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/ErrorContrato'}
        '404': {$ref: '#/components/responses/ErrorContrato'}

  /health/live:
