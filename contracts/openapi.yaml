        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
    post:
      operationId: submitVehicleDocument
      summary: Registrar revisión de seguro o documentación
      tags: [Documents]
      x-planned-delivery: E1
      x-allowed-human-roles: [Conductor]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
