      summary: Última ubicación registrada (contrato común M3 2.0.0)
      description: >-
        Última posición conocida por M3 (simulador de ubicación). Sin ubicación todavía, responde 200 con latitud,
        longitud y fecha_act_ubic en null: ubicación desconocida, nunca (0, 0). No aplica vencimiento.
      tags: [Contrato común M3 2.0.0]
      x-allowed-human-roles: [Conductor (propio), Operador, Administrador]
      x-required-service-roles: [SERVICIO, ubicacion-be, solicitud-be, viajes-be, 'SCOPE_m3:drivers:read']
      responses:
        '200':
          description: Última ubicación o nulos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UbicacionConductor'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/ErrorContrato'}
        '404': {$ref: '#/components/responses/ErrorContrato'}

  /api/v1/conductores/{id_conductor}/vehiculos/{id_vehiculo}:
    parameters:
      - {$ref: '#/components/parameters/IdConductor'}
      - {$ref: '#/components/parameters/IdVehiculo'}
    get:
      operationId: obtenerVehiculoContrato
      summary: Vehículo del conductor (contrato común M3 2.0.0)
      description: >-
        M4 lo usa con id_vehiculo_activo para comprobar tipo y habilitación. tipos_serv se deriva de las categorías del
        vehículo (DELIVERY → ENVIOS; STANDARD, PREMIUM y PETS → PASAJEROS) y habilitado refleja la habilitación del
        vehículo. documentos trae la revisión actual de seguro (SEGURO) y cédula (CEDULA_VERDE).
      tags: [Contrato común M3 2.0.0]
      x-allowed-human-roles: [Conductor (propio), Operador, Administrador]
      x-required-service-roles: [SERVICIO, ubicacion-be, solicitud-be, viajes-be, 'SCOPE_m3:drivers:read']
      responses:
        '200':
