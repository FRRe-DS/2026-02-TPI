server:
  port: ${SERVER_PORT:3003}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: m3-drivers-vehicles
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/m3_db}
    username: ${SPRING_DATASOURCE_USERNAME:m3_user}
    password: ${SPRING_DATASOURCE_PASSWORD:m3_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_WEB_CLIENT_ID:m3-web-client}
            client-secret: ${OIDC_WEB_CLIENT_SECRET:}
            # El realm compartido sólo garantiza OpenID; M3 identifica al usuario con `sub`.
            scope: openid
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: ${OIDC_AUTH_URI:http://localhost:8080/realms/ds-2025-realm/protocol/openid-connect/auth}
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8080/realms/ds-2025-realm/protocol/openid-connect/token}
            jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8080/realms/ds-2025-realm/protocol/openid-connect/certs}
            user-info-uri: ${OIDC_USERINFO_URI:http://localhost:8080/realms/ds-2025-realm/protocol/openid-connect/userinfo}
            # `sub` es el único claim de identidad obligatorio de OpenID Connect.
            # M1 lo entrega aun cuando no habilita los scopes opcionales profile/email.
            user-name-attribute: sub

# Parámetros para desarrollo y pruebas locales
app:
  demo-access:
    # Sólo se habilita en una ejecución local explícita; nunca viene activo por defecto.
    enabled: ${DEMO_ACCESS_ENABLED:false}
    subject: ${DEMO_ACCESS_SUBJECT:}
    roles: ${DEMO_ACCESS_ROLES:ROLE_DRIVER}
  security:
    mock-subject: ${APP_SECURITY_MOCK_SUBJECT:}
    issuer: ${OIDC_ISSUER:}
    jwks-uri: ${OIDC_JWKS_URI:}
    audience: ${OIDC_AUDIENCE:account}

# Actuator y Monitoreo
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# Configuración de Springdoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

m3:
  integration:
    m4-base-url: ${M4_BASE_URL:http://localhost:4004}
    m5-base-url: ${M5_BASE_URL:http://localhost:5005}
    m6-base-url: ${M6_BASE_URL:http://localhost:6006}
    token-uri: ${OIDC_TECH_TOKEN_URI:}
    client-id: ${OIDC_TECH_CLIENT_ID:}
    client-secret: ${OIDC_TECH_CLIENT_SECRET:}
    # Scope OAuth del token técnico para M4. Vacío: no se envía y M1 aplica los scopes por defecto del cliente.
    # M4 Grupo 03 autoriza por rol (conductores-be del cliente grupo-02), no por scope.
    m4-token-scope: ${M4_TOKEN_SCOPE:}
    # M5 Grupo 04 exige este scope en el token de M3 para aceptar la respuesta del conductor.
    m5-token-scope: ${M5_TOKEN_SCOPE:m5:offers:respond}
    # M6 (grupos 05 y 12) autoriza por rol de servicio (SYSTEM/SERVICIO), no por scope.
    m6-token-scope: ${M6_TOKEN_SCOPE:}
    # Consulta periódica de viajes activos en M6 para detectar fin o cancelación.
    m6-sync-enabled: ${M6_SYNC_ENABLED:true}
    m6-sync-ms: ${M6_SYNC_MS:10000}
    worker-enabled: ${M4_WORKER_ENABLED:true}
  security:
    # Roles o scopes que cuentan como el rol "servicio" del contrato M3 2.0.0 para leer
    # /api/v1/conductores/{id}/estado, /ubicacion y /vehiculos/{id}. Coma como separador.
    service-read-roles: ${M3_SERVICE_READ_ROLES:SERVICIO,SCOPE_m3:drivers:read,ubicacion-be,solicitud-be,viajes-be}
    # Roles con los que M5 puede entregar ofertas en POST /api/v1/integration/m5/offers (además de SCOPE_m5:offers:write).
    m5-offer-roles: ${M3_M5_OFFER_ROLES:SERVICIO,solicitud-be}

location-simulator:
  enabled: ${LOCATION_SIMULATOR_ENABLED:true}
  interval-ms: ${LOCATION_SIMULATOR_INTERVAL_MS:5000}
  max-step-meters: ${LOCATION_SIMULATOR_MAX_STEP_METERS:35}

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/m3_db}
    username: ${SPRING_DATASOURCE_USERNAME:m3_user}
    password: ${SPRING_DATASOURCE_PASSWORD:m3_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
