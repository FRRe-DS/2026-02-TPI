server:
  port: ${SERVER_PORT:3003}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: m3-drivers-vehicles
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/m3_db}
    username: ${SPRING_DATASOURCE_USERNAME:m3_user}
    password: ${SPRING_DATASOURCE_PASSWORD:m3_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_WEB_CLIENT_ID:m3-web-client}
            client-secret: ${OIDC_WEB_CLIENT_SECRET:}
            # El realm compartido sólo garantiza OpenID; M3 identifica al usuario con `sub`.
            scope: openid
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: ${OIDC_AUTH_URI:http://localhost:8080/realms/ds-2025-realm/protocol/openid-connect/auth}
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8080/realms/ds-2025-realm/protocol/openid-connect/token}
            jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8080/realms/ds-2025-realm/protocol/openid-connect/certs}
            user-info-uri: ${OIDC_USERINFO_URI:http://localhost:8080/realms/ds-2025-realm/protocol/openid-connect/userinfo}
            # `sub` es el único claim de identidad obligatorio de OpenID Connect.
            # M1 lo entrega aun cuando no habilita los scopes opcionales profile/email.
            user-name-attribute: sub

# Parámetros para desarrollo y pruebas locales
app:
  demo-access:
    # Sólo se habilita en una ejecución local explícita; nunca viene activo por defecto.
    enabled: ${DEMO_ACCESS_ENABLED:false}
    subject: ${DEMO_ACCESS_SUBJECT:}
    roles: ${DEMO_ACCESS_ROLES:ROLE_DRIVER}
  security:
    mock-subject: ${APP_SECURITY_MOCK_SUBJECT:}
    issuer: ${OIDC_ISSUER:}
    jwks-uri: ${OIDC_JWKS_URI:}
    audience: ${OIDC_AUDIENCE:account}

# Actuator y Monitoreo
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# Configuración de Springdoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

m3:
  integration:
    m4-base-url: ${M4_BASE_URL:http://localhost:4004}
    m6-base-url: ${M6_BASE_URL:http://localhost:6006}
    token-uri: ${OIDC_TECH_TOKEN_URI:}
    client-id: ${OIDC_TECH_CLIENT_ID:}
    client-secret: ${OIDC_TECH_CLIENT_SECRET:}
    worker-enabled: ${M4_WORKER_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/m3_db}
    username: ${SPRING_DATASOURCE_USERNAME:m3_user}
    password: ${SPRING_DATASOURCE_PASSWORD:m3_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
