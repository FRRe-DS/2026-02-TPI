server:
  port: 3003

spring:
  application:
    name: m3-drivers-vehicles
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/m3_db}
    username: ${SPRING_DATASOURCE_USERNAME:m3_user}
    password: ${SPRING_DATASOURCE_PASSWORD:m3_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

