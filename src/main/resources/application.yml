server:
  port: ${SERVER_PORT:3003}

spring:
  application:
    name: m3-drivers-vehicles
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/m3_db}
    username: ${SPRING_DATASOURCE_USERNAME:m3_user}
    password: ${SPRING_DATASOURCE_PASSWORD:m3_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:}
          jwk-set-uri: ${OIDC_JWKS_URI:}
          audiences: ${OIDC_AUDIENCE:m3-service}
      client:
        registration:
          keycloak:
            client-id: ${OIDC_WEB_CLIENT_ID:m3-web-client}
            client-secret: ${OIDC_WEB_CLIENT_SECRET:m3-web-secret}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER:http://localhost:8080/realms/clonuber}

# Parámetros para desarrollo y pruebas locales
app:
  security:
    mock-subject: ${APP_SECURITY_MOCK_SUBJECT:user-sub-123}

# Actuator y Monitoreo
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# Configuración de Springdoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/m3_db}
    username: ${SPRING_DATASOURCE_USERNAME:m3_user}
    password: ${SPRING_DATASOURCE_PASSWORD:m3_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
