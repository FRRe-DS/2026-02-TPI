server:
  port: 3003

spring:
  application:
    name: m3-drivers-vehicles

  datasource:
    url: jdbc:postgresql://localhost:5432/m3_db
    username: m3_user
    password: m3_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
