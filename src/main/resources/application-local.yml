spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:m3_local_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false # En H2 memoria para desarrollo ultrarrápido usamos ddl-auto

  thymeleaf:
    cache: false

app:
  security:
    mock-subject: "user-sub-123"

logging:
  level:
    ar.edu.utn.frre.m3: DEBUG
    org.springframework.security: INFO
