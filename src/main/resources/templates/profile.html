<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi perfil · M3</title><link rel="stylesheet" th:href="@{/css/workspace.css}"></head><body><nav th:replace="~{workspace :: navigation}"></nav><main class="workspace-main"><header><p class="eyebrow">CONDUCTORES Y VEHÍCULOS</p><h1>Mi perfil</h1></header><section class="panel"><div class="heading-row"><div><h2 th:text="${driver.fullName}"></h2><span class="status-pill" th:attr="data-status=${driver.status}" th:text="${driver.statusDescription}"></span></div><a class="button secondary" href="/ui/profile/edit">Actualizar datos</a></div>
<p class="notice" th:text="${driver.guidanceMessage}"></p><p th:if="${driver.qualificationReason != null}" th:text="${driver.qualificationReason}"></p>
<div class="actions"><a class="button" href="/ui/qualification">Consultar habilitación</a><a class="button secondary" href="/ui/documents">Gestionar documentación</a></div></section>
<section class="panel"><h2>Datos personales</h2><dl class="detail-grid"><div><dt>Nombre completo</dt><dd th:text="${driver.fullName}"></dd></div><div><dt>DNI</dt><dd th:text="${driver.dni ?: 'No registrado'}"></dd></div><div><dt>Fecha de nacimiento</dt><dd th:text="${driver.birthDateFormatted}"></dd></div><div><dt>Correo electrónico</dt><dd th:text="${driver.email ?: 'No registrado'}"></dd></div><div><dt>Teléfono</dt><dd th:text="${driver.phone}"></dd></div><div><dt>Dirección</dt><dd th:text="${driver.address}"></dd></div></dl></section>
<section class="panel"><h2>Actividad del perfil</h2><dl class="detail-grid"><div><dt>Fecha de registro</dt><dd th:text="${driver.createdAtFormatted}"></dd></div><div><dt>Última actualización</dt><dd th:text="${driver.updatedAtFormatted}"></dd></div></dl></section></main></body></html>
