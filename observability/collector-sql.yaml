receivers:
  sqlquery/drivers:
    driver: postgres
    datasource: 'host=postgres port=5432 dbname=m3_db user=m3_otel password=${env:OTEL_SQL_PASSWORD} sslmode=disable connect_timeout=5'
    collection_interval: 60s
    max_open_conn: 1
    queries:
      - sql: SELECT value FROM observability.available_drivers
        metrics:
          - metric_name: m3.drivers.available
            description: Conductores habilitados con documentos vigentes e intención disponible aplicada en M4
            value_column: value
            data_type: gauge
            value_type: int
            unit: '{driver}'

processors:
  resource/business:
    attributes:
      - key: service.name
        value: m3-drivers-vehicles
        action: upsert
      - key: service.namespace
        value: utn-frre
        action: upsert
      - key: deployment.environment.name
        value: local
        action: upsert

service:
  pipelines:
    metrics/business:
      receivers: [sqlquery/drivers]
      processors: [memory_limiter, resource/business, batch]
      exporters: [debug, prometheus]
