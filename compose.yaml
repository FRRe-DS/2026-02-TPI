services:
  postgres:
    image: postgres:16-alpine
    container_name: m3-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: m3_db
      POSTGRES_USER: m3_user
      POSTGRES_PASSWORD: m3_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
