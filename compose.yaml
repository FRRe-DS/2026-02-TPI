services:
  m3-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: clonuber/m3-drivers-vehicles:0.2.0
    container_name: m3-app
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      SERVER_PORT: 3003
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/m3_db
      SPRING_DATASOURCE_USERNAME: m3_user
      SPRING_DATASOURCE_PASSWORD: m3_password
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_AUTH_URI: ${OIDC_AUTH_URI:-http://localhost:8080/realms/ds-2025-realm/protocol/openid-connect/auth}
      OIDC_TOKEN_URI: ${OIDC_TOKEN_URI:-http://localhost:8080/realms/ds-2025-realm/protocol/openid-connect/token}
      OIDC_USERINFO_URI: ${OIDC_USERINFO_URI:-http://localhost:8080/realms/ds-2025-realm/protocol/openid-connect/userinfo}
      OIDC_TECH_TOKEN_URI: ${OIDC_TECH_TOKEN_URI:-}
      OIDC_TECH_CLIENT_ID: ${OIDC_TECH_CLIENT_ID:-}
      OIDC_TECH_CLIENT_SECRET: ${OIDC_TECH_CLIENT_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      M4_WORKER_ENABLED: ${M4_WORKER_ENABLED:-true}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-account}
      OIDC_WEB_CLIENT_ID: ${OIDC_WEB_CLIENT_ID:-}
      OIDC_WEB_CLIENT_SECRET: ${OIDC_WEB_CLIENT_SECRET:-}
      SPRING_PROFILES_ACTIVE: docker
      M4_BASE_URL: ${M4_BASE_URL:-http://localhost:4004}
      M6_BASE_URL: ${M6_BASE_URL:-http://localhost:6006}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - m3_network

  postgres:
    image: postgres:16-alpine
    container_name: m3_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: m3_db
      POSTGRES_USER: m3_user
      POSTGRES_PASSWORD: m3_password
    volumes:
      - m3_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m3_user -d m3_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - m3_network

volumes:
  m3_postgres_data:
    name: m3_postgres_data

networks:
  m3_network:
    name: m3_network
